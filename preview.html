    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J&W Creative Studio - Preview</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0a0a0a;
        color: #e4e4e7;
        line-height: 1.6;
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
      header {
        text-align: center;
        padding: 4rem 1rem 3rem;
        border-bottom: 1px solid #27272a;
        margin-bottom: 3rem;
      }
      header h1 {
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 3rem;
        color: #fff;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      header p {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #71717a;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.25rem 0.75rem;
        background: #7f1d1d;
        color: #fca5a5;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-radius: 2px;
      }
      .photographers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
      }
      .photographer-card {
        background: #18181b;
        border: 1px solid #27272a;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .photographer-card:hover { border-color: #3f3f46; }
      .card-cover {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .card-cover-placeholder {
        width: 100%;
        height: 200px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #3f3f46;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .card-body { padding: 1.5rem; }
      .card-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .profile-img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #0a0a0a;
        flex-shrink: 0;
        background: #000;
      }
      .profile-img-placeholder {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #27272a;
        border: 2px solid #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #52525b;
        font-size: 0.65rem;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .card-title { flex: 1; }
      .card-title h2 {
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 1.25rem;
        color: #fff;
        margin-bottom: 0.25rem;
      }
      .card-title .role {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #71717a;
        font-weight: 600;
      }
      .card-bio {
        font-size: 0.8rem;
        color: #a1a1aa;
        margin-bottom: 1rem;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .meta-tag {
        font-size: 0.65rem;
        padding: 0.2rem 0.5rem;
        background: #27272a;
        color: #a1a1aa;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 2px;
      }
      .portfolio-section {
        border-top: 1px solid #27272a;
        padding-top: 1rem;
        margin-top: 1rem;
      }
      .portfolio-title {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #71717a;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }
      .portfolio-grid img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .portfolio-grid .empty {
        aspect-ratio: 1;
        background: #27272a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #52525b;
        font-size: 0.6rem;
        text-transform: uppercase;
      }
      .social-links {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      .social-links a {
        font-size: 0.7rem;
        color: #a1a1aa;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: color 0.2s;
      }
      .social-links a:hover { color: #fff; }
      footer {
        text-align: center;
        padding: 3rem 1rem;
        margin-top: 4rem;
        border-top: 1px solid #27272a;
        color: #52525b;
        font-size: 0.75rem;
      }
      @media (max-width: 640px) {
        header h1 { font-size: 2rem; }
        .photographers-grid { grid-template-columns: 1fr; }
      }
    </style>

      function renderPhotographers() {
        const container = document.getElementById('photographers');
        container.innerHTML = photographers.map(p => {
          const profileHtml = p.profile_image
            ? `<img src="${p.profile_image}" alt="${p.name}" class="profile-img" onerror="this.outerHTML='<div class=\\'profile-img-placeholder\\'>No Photo</div>'">`
            : `<div class="profile-img-placeholder">No Photo</div>`;
          const coverHtml = p.cover_image
            ? `<img src="${p.cover_image}" alt="${p.name}" class="card-cover" onerror="this.outerHTML='<div class=\\'card-cover-placeholder\\'>No Cover</div>'">`
            : `<div class="card-cover-placeholder">No Cover</div>`;
          const portfolioHtml = p.portfolio && p.portfolio.length > 0
            ? `<div class="portfolio-grid">${p.portfolio.slice(0, 6).map(img => `<img src="${img.imageUrl}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`
            : `<div class="portfolio-grid"><div class="empty">No images</div></div>`;
          const socials = [];
          if (p.instagram) socials.push(`<a href="https://instagram.com/${p.instagram}" target="_blank">Instagram</a>`);
          if (p.facebook) socials.push(`<a href="${p.facebook}" target="_blank">Facebook</a>`);
          if (p.linkedin) socials.push(`<a href="${p.linkedin}" target="_blank">LinkedIn</a>`);
          return `
            <article class="photographer-card">
              ${coverHtml}
              <div class="card-body">
                <div class="card-header">
                  ${profileHtml}
                  <div class="card-title">
                    <h2>${p.name}</h2>
                    <div class="role">${p.role}</div>
                  </div>
                </div>
                <p class="card-bio">${p.bio}</p>
                <div class="card-meta">
                  <span class="meta-tag">${p.availability}</span>
                </div>
                <div class="portfolio-section">
                  <div class="portfolio-title">Portfolio</div>
                  ${portfolioHtml}
                </div>
                ${socials.length > 0 ? `<div class="social-links">${socials.join('')}</div>` : ''}
              </div>
            </article>
          `;
        }).join('');
      }

      document.addEventListener('DOMContentLoaded', renderPhotographers);
